; Room-code relay used by every copy of the game.
; Leave this on localhost and the host's game opens the room itself.
; Friends on the same network find it from the code.
; Friends on other networks can join because the host's game opens its own
; router port (UPnP, then NAT-PMP) and renews it while the room is open.
;
; For reliable play from any network, run multiplayer/run_relay.gd on a
; public machine and put that address here, or in user://relay.cfg:
;   [relay]
;   url="ws://your-server:9050"
[relay]
url="ws://127.0.0.1:9050"
